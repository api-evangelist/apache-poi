name: Apache POI Document Processing Workflow
description: Workflow capability for creating and manipulating Microsoft Office documents using Apache POI.
version: 1.0.0-alpha1
apis:
  - name: Apache POI API
    url: https://raw.githubusercontent.com/api-evangelist/apache-poi/refs/heads/main/apis.yml
shared:
  - url: capabilities/shared/poi-api.yaml
workflow:
  name: poi-workflow
  description: Process and transform Microsoft Office documents using Apache POI.
  steps:
    - name: create-workbook
      description: Create a new Excel workbook
      api: Apache POI API
      operation: createWorkbook
    - name: get-cells
      description: Extract cell data from a workbook sheet
      api: Apache POI API
      operation: getCells
    - name: create-document
      description: Create a Word document
      api: Apache POI API
      operation: createDocument
    - name: create-presentation
      description: Create a PowerPoint presentation
      api: Apache POI API
      operation: createPresentation
    - name: convert-document
      description: Convert between Office formats
      api: Apache POI API
      operation: convertDocument
exposes:
  - type: rest
    port: 8080
    paths:
      - /workbooks
      - /workbooks/{workbookId}
      - /workbooks/{workbookId}/sheets
      - /documents
      - /documents/{documentId}
      - /presentations
      - /presentations/{presentationId}
      - /convert
  - type: mcp
    port: 9090
    tools:
      - name: list-workbooks
        description: List Excel workbooks
        operation: listWorkbooks
      - name: create-workbook
        description: Create an Excel workbook
        operation: createWorkbook
      - name: get-cells
        description: Get cell data from a sheet
        operation: getCells
      - name: create-document
        description: Create a Word document
        operation: createDocument
      - name: get-document
        description: Retrieve a Word document
        operation: getDocument
      - name: create-presentation
        description: Create a PowerPoint presentation
        operation: createPresentation
      - name: get-presentation
        description: Retrieve a PowerPoint presentation
        operation: getPresentation
      - name: convert-document
        description: Convert between Office document formats
        operation: convertDocument
